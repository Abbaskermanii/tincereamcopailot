# Isolated test stack — run with:
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml run --rm backend pytest -x -q
#   docker compose -f docker-compose.test.yml down -v

services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ceramics_test
      POSTGRES_PASSWORD: ceramics_test
      POSTGRES_DB: ceramics_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceramics_test -d ceramics_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  test-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  test-minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: testminioadmin
      MINIO_ROOT_PASSWORD: testminioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_URL: postgresql+psycopg://ceramics_test:ceramics_test@test-db:5432/ceramics_test
      REDIS_URL: redis://test-redis:6379/0
      S3_ENDPOINT: http://test-minio:9000
      S3_ACCESS_KEY: testminioadmin
      S3_SECRET_KEY: testminioadmin123
      RATE_LIMIT_ENABLED: "false"
      ENVIRONMENT: test
      SECRET_KEY: test-secret-key-for-automated-testing-only-32ch
      SMS_DEBUG: "true"
      AUTH_COOKIES_SECURE: "false"
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    command: >
      sh -c "python -c 'from app.core.config import get_settings; get_settings.cache_clear()' &&
             pytest -x -q --tb=short"
    working_dir: /code
